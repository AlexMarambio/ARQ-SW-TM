  api-gateway:
    build:
      context: ..
      dockerfile: repararia/api-gateway/Dockerfile
    container_name: repararia-api-gateway
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ALGORITHM: HS256

      BUS_HOST: bus
      BUS_PORT: 5000

      AUTH_SERVICE_HOST: servicio-autenticacion
      AUTH_SERVICE_PORT: 5001

      CLIENTES_SERVICE_HOST: servicio-clientes
      CLIENTES_SERVICE_PORT: 5002

      ORDENES_SERVICE_HOST: servicio-ordenes
      ORDENES_SERVICE_PORT: 5003

      INVENTARIO_SERVICE_HOST: servicio-inventario
      INVENTARIO_SERVICE_PORT: 5004

      FACTURACION_SERVICE_HOST: servicio-facturacion
      FACTURACION_SERVICE_PORT: 5005
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      bus:
        condition: service_started
      servicio-autenticacion:
        condition: service_started
      # servicio-clientes:
