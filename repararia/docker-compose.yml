      # servicio-inventario:
      #   condition: service_started
      # servicio-facturacion:
      #   condition: service_started
    networks:
      - repararia-internal

  frontend:
    build:
      context: ./frontend
    container_name: repararia-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://api-gateway:8000
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    networks:
      - repararia-internal

volumes:
  postgres_data:
  chroma_data:

networks:
  repararia-internal:
    driver: bridge