services:
  postgres:
    image: postgres:16-alpine
    container_name: repararia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repararia
      POSTGRES_USER: repararia
      POSTGRES_PASSWORD: repararia_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repararia -d repararia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - repararia-internal

  chromadb:
    image: chromadb/chroma:latest
    container_name: repararia-chromadb
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - repararia-internal

  # Agrega esto a tu docker-compose existente

  ia-service:
    build:
      context: ./services/ia
      dockerfile: Dockerfile
    container_name: repararia-ia
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      - chromadb
    networks:
      - repararia-internal

  bus:
    image: jrgiadach/soabus:v1
    container_name: repararia-bus
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - repararia-internal

  servicio-autenticacion:
    build:
      context: ./services/auth
    container_name: repararia-servicio-autenticacion
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://repararia:repararia_dev@postgres:5432/repararia
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      TCP_HOST: 0.0.0.0
      TCP_PORT: 5001
      BUS_HOST: bus
      BUS_PORT: 5000
    expose:
      - "5001"
    depends_on:
      postgres:
        condition: service_healthy
      bus:
        condition: service_started
    networks:
      - repararia-internal

  servicio-cliente:
    build:
      context: ./services/cliente
    container_name: repararia-servicio-cliente
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://repararia:repararia_dev@postgres:5432/repararia
      TCP_HOST: 0.0.0.0
      TCP_PORT: 5002
      BUS_HOST: bus
      BUS_PORT: 5000
    expose:
      - "5002"
    depends_on:
      postgres:
        condition: service_healthy
      bus:
        condition: service_started
    networks:
      - repararia-internal

  servicio-vehiculo:
    build:
      context: ./services/vehiculo
    container_name: repararia-servicio-vehiculo
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://repararia:repararia_dev@postgres:5432/repararia
      TCP_HOST: 0.0.0.0
      TCP_PORT: 5003
      BUS_HOST: bus
      BUS_PORT: 5000
    expose:
      - "5003"
    depends_on:
      postgres:
        condition: service_healthy
      bus:
        condition: service_started
    networks:
      - repararia-internal

  servicio-repuesto:
    build:
      context: ./services/repuesto
    container_name: repararia-servicio-repuesto
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://repararia:repararia_dev@postgres:5432/repararia
      TCP_HOST: 0.0.0.0
      TCP_PORT: 5004
      BUS_HOST: bus
      BUS_PORT: 5000
    expose:
      - "5004"
    depends_on:
      postgres:
        condition: service_healthy
      bus:
        condition: service_started
    networks:
      - repararia-internal

  servicio-facturacion:
    build:
      context: ./services/facturacion
    container_name: repararia-servicio-facturacion
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://repararia:repararia_dev@postgres:5432/repararia
      TCP_HOST: 0.0.0.0
      TCP_PORT: 5005
      BUS_HOST: bus
      BUS_PORT: 5000
    expose:
      - "5005"
    depends_on:
      postgres:
        condition: service_healthy
      bus:
        condition: service_started
    networks:
      - repararia-internal

  servicio-ordenes:
    build:
      context: ./services/ordenes
    container_name: repararia-servicio-ordenes
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://repararia:repararia_dev@postgres:5432/repararia
      TCP_HOST: 0.0.0.0
      TCP_PORT: 5006
      BUS_HOST: bus
      BUS_PORT: 5000
      REPUESTO_SERVICE_HOST: servicio-repuesto
      REPUESTO_SERVICE_PORT: 5004
      FACTURACION_SERVICE_HOST: servicio-facturacion
      FACTURACION_SERVICE_PORT: 5005
    expose:
      - "5006"
    depends_on:
      postgres:
        condition: service_healthy
      bus:
        condition: service_started
      servicio-repuesto:
        condition: service_started
      servicio-facturacion:
        condition: service_started
    networks:
      - repararia-internal

  api-gateway:
    build: ./api-gateway
    container_name: repararia-api-gateway
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ALGORITHM: HS256

      BUS_HOST: bus
      BUS_PORT: 5000

      AUTH_SERVICE_HOST: servicio-autenticacion
      AUTH_SERVICE_PORT: 5001

      CLIENTES_SERVICE_HOST: servicio-clientes
      CLIENTES_SERVICE_PORT: 5002

      VEHICULOS_SERVICE_HOST: servicio-vehiculos
      VEHICULOS_SERVICE_PORT: 5003

      REPUESTO_SERVICE_HOST: servicio-repuesto
      REPUESTO_SERVICE_PORT: 5004

      FACTURACION_SERVICE_HOST: servicio-facturacion
      FACTURACION_SERVICE_PORT: 5005

      ORDENES_SERVICE_HOST: servicio-ordenes
      ORDENES_SERVICE_PORT: 5006

    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      bus:
        condition: service_started
      servicio-autenticacion:
        condition: service_started
      servicio-cliente:
        condition: service_started
      servicio-vehiculo:
        condition: service_started
      servicio-repuesto:
        condition: service_started
      servicio-facturacion:
        condition: service_started
      servicio-ordenes:
        condition: service_started
    networks:
      - repararia-internal

  frontend:
    build:
      context: ./frontend
    container_name: repararia-frontend
    restart: unless-stopped
    environment:
      #VITE_API_BASE_URL: http://api-gateway:8000
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes: # PRUEBA
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    networks:
      - repararia-internal

volumes:
  postgres_data:
  chroma_data:

networks:
  repararia-internal:
    driver: bridge
