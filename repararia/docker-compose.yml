services:
  postgres:
    image: postgres:16-alpine
    container_name: repararia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repararia
      POSTGRES_USER: repararia
      POSTGRES_PASSWORD: repararia_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repararia -d repararia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - repararia-internal

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: repararia-chromadb
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - repararia-internal

  bus:
    image: jrgiadach/soabus:v1
    container_name: repararia-bus
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - repararia-internal

  servicio-autenticacion:
    build:
      context: ./services/auth
    container_name: repararia-servicio-autenticacion
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://repararia:repararia_dev@postgres:5432/repararia
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      TCP_HOST: 0.0.0.0
      TCP_PORT: 5001
      BUS_HOST: bus
      BUS_PORT: 5000
    expose:
      - "5001"
    depends_on:
      postgres:
        condition: service_healthy
      bus:
        condition: service_started
    networks:
      - repararia-internal

